# Test scenarios (deDE and enUS) and translation check on every push and pull request
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install fengari
        working-directory: tests
        run: npm ci --no-fund --no-audit

      - name: Test scenarios
        shell: pwsh
        run: ./tests/Invoke-QnTests.ps1

      - name: Translations
        run: node tests/check-locale.mjs
